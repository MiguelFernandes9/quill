name: Quill

options:
  bundleIdPrefix: com.miguel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Miguel's personal team — baked in so `xcodegen generate` keeps signing.
    DEVELOPMENT_TEAM: WU79HE9Z5S

targets:
  Quill:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Quill
        excludes:
          - "Resources/Info.plist"
          - "Resources/Quill.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miguel.quill
        INFOPLIST_FILE: Quill/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Quill/Resources/Quill.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # Family 6 = Mac idiom ("Optimize Interface for Mac"): Catalyst renders
        # 1:1 instead of the 77% scaled-to-iPad mode, so the Studio design's
        # sizes appear as designed.
        TARGETED_DEVICE_FAMILY: "1,2,6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  QuillTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - QuillTests
    dependencies:
      - target: Quill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.miguel.quillTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Quill:
    build:
      targets:
        Quill: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuillTests
